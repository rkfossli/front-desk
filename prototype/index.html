<title>Front Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: a dev toolbar above a phone frame; inside the frame, the messaging app (inbox or one conversation). Skin tokens switch between Android Messages and iMessage. */
:root {
  --page-bg: #1b1d22; --page-fg: #d6d8de; --page-muted: #8b8f99; --page-accent: #8ab4f8;
  --font-ui: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Roboto Mono", ui-monospace, Menlo, monospace;
  /* Android Messages, light */
  --bg: #ffffff; --fg: #1f1f1f; --muted: #444746; --faint: #747775;
  --bar-bg: #f3f6fc; --in-bg: #f0f4f9; --in-fg: #1f1f1f; --out-bg: #d3e3fd; --out-fg: #041e49;
  --accent: #0b57d0; --chip-bg: #ffffff; --chip-border: #c4c7c5; --chip-fg: #0b57d0; --field-bg: #f0f4f9;
  --avatar: #c2e7ff; --avatar-fg: #001d35; --unread: #0b57d0; --sys-fg: #5e5e5e; --divider: #e3e3e3;
  --radius: 20px; --tail: 4px; --list-radius: 0px;
  --sheet-bg: #202124; --sheet-fg: #e8eaed;
}
:root[data-skin="ios"] {
  --font-ui: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --bg: #ffffff; --fg: #000000; --muted: #3c3c43; --faint: #8e8e93;
  --bar-bg: rgba(249,249,249,.94); --in-bg: #e9e9eb; --in-fg: #000000; --out-bg: #007aff; --out-fg: #ffffff;
  --accent: #007aff; --chip-bg: #ffffff; --chip-border: #d1d1d6; --chip-fg: #007aff; --field-bg: #ffffff;
  --avatar: #a8aeb8; --avatar-fg: #ffffff; --unread: #007aff; --sys-fg: #8e8e93; --divider: #e5e5ea;
  --radius: 18px; --tail: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e10; --fg: #e3e3e3; --muted: #c4c7c5; --faint: #8e918f;
    --bar-bg: #1b1b1f; --in-bg: #1e1f22; --in-fg: #e3e3e3; --out-bg: #0842a0; --out-fg: #d3e3fd;
    --accent: #a8c7fa; --chip-bg: #1e1f22; --chip-border: #444746; --chip-fg: #a8c7fa; --field-bg: #1e1f22;
    --avatar: #004a77; --avatar-fg: #c2e7ff; --unread: #a8c7fa; --sys-fg: #9aa0a6; --divider: #2b2c30; color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-skin="ios"] {
    --bg: #000000; --fg: #ffffff; --muted: #ebebf5; --faint: #8d8d93;
    --bar-bg: rgba(29,29,31,.94); --in-bg: #26252a; --in-fg: #ffffff; --out-bg: #0a84ff; --out-fg: #ffffff;
    --accent: #0a84ff; --chip-bg: #1c1c1e; --chip-border: #3a3a3c; --chip-fg: #0a84ff; --field-bg: #1c1c1e;
    --avatar: #6c6c70; --avatar-fg: #ffffff; --unread: #0a84ff; --sys-fg: #8d8d93; --divider: #2c2c2e;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e10; --fg: #e3e3e3; --muted: #c4c7c5; --faint: #8e918f;
  --bar-bg: #1b1b1f; --in-bg: #1e1f22; --in-fg: #e3e3e3; --out-bg: #0842a0; --out-fg: #d3e3fd;
  --accent: #a8c7fa; --chip-bg: #1e1f22; --chip-border: #444746; --chip-fg: #a8c7fa; --field-bg: #1e1f22;
  --avatar: #004a77; --avatar-fg: #c2e7ff; --unread: #a8c7fa; --sys-fg: #9aa0a6; --divider: #2b2c30; color-scheme: dark;
}
:root[data-theme="dark"][data-skin="ios"] {
  --bg: #000000; --fg: #ffffff; --muted: #ebebf5; --faint: #8d8d93;
  --bar-bg: rgba(29,29,31,.94); --in-bg: #26252a; --in-fg: #ffffff; --out-bg: #0a84ff; --out-fg: #ffffff;
  --accent: #0a84ff; --chip-bg: #1c1c1e; --chip-border: #3a3a3c; --chip-fg: #0a84ff; --field-bg: #1c1c1e;
  --avatar: #6c6c70; --avatar-fg: #ffffff; --unread: #0a84ff; --sys-fg: #8d8d93; --divider: #2c2c2e;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--page-bg); color: var(--page-fg); font-family: var(--font-ui);
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow: hidden;
}
* { box-sizing: border-box; }
button { font: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Dev toolbar (not part of the game) */
/* Dev settings: hidden by default so the phone looks like the finished game. Long-press the clock (or press D) to open. */
.tools { position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: center; font-size: 12.5px; color: var(--page-muted); background: var(--sheet-bg); border-radius: 24px 24px 0 0; padding: 16px 16px 22px; box-shadow: 0 -10px 30px rgba(0,0,0,.4); }
.tools .close { position: absolute; top: 8px; right: 10px; background: transparent; border: 0; color: var(--page-muted); font-size: 18px; width: 32px; height: 32px; border-radius: 50%; }
.tools .hint { width: 100%; text-align: center; font-size: 11px; color: var(--page-muted); }
.tools .grp { display: flex; align-items: center; gap: 6px; }
.tools label { letter-spacing: .04em; text-transform: uppercase; font-size: 10.5px; }
.seg { display: inline-flex; border: 1px solid #3a3d45; border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; color: var(--page-fg); border: 0; padding: 5px 10px; font-size: 12.5px; }
.seg button + button { border-left: 1px solid #3a3d45; }
.seg button[aria-pressed="true"] { background: #2f3340; color: #fff; }
.tools .flags { font-family: var(--font-mono); font-size: 11px; color: var(--page-muted); }
.tools select { background: #1e2127; color: #e6e6e6; border: 1px solid #3a3d45; border-radius: 8px; padding: 5px 8px; font-size: 12.5px; }
.tools .reset { background: transparent; color: var(--page-accent); border: 1px solid #3a3d45; border-radius: 8px; padding: 5px 10px; font-size: 12.5px; }

/* Phone frame */
.phone {
  position: relative; width: 390px; max-width: 100%; height: 800px; max-height: calc(100% - 60px);
  background: var(--bg); color: var(--fg); border-radius: 36px; overflow: hidden;
  box-shadow: 0 0 0 10px #0c0d10, 0 0 0 12px #2a2d35, 0 30px 60px rgba(0,0,0,.6);
  display: flex; flex-direction: column; font-family: var(--font-ui);
}
@media (max-width: 480px) {
  body { padding: 0; gap: 0; }
  .tools .flags { display: none; }
  .phone { width: 100%; height: 100%; max-height: none; border-radius: 0; box-shadow: none; }
}
/* Status bar: Android = clock left, wifi/signal/battery right; iPhone = bold clock, Dynamic Island, signal bars/wifi/battery. Neither shows AM/PM. */
.statusbar { position: relative; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; font-weight: 500; background: var(--bar-bg); color: var(--fg); flex: none; }
:root[data-skin="ios"] .statusbar { height: 50px; font-size: 16px; font-weight: 600; padding: 0 30px 0 36px; }
.statusbar .right { display: flex; gap: 5px; align-items: center; font-size: 12px; }
.statusbar .right svg { width: 16px; height: 16px; fill: currentColor; display: block; }
.statusbar .island { display: none; }
:root[data-skin="ios"] .statusbar .island { display: block; position: absolute; left: 50%; top: 11px; transform: translateX(-50%); width: 112px; height: 32px; border-radius: 18px; background: #000; }
.statusbar .bars { display: none; align-items: flex-end; gap: 1.5px; height: 11px; }
.statusbar .bars i { width: 3px; background: currentColor; border-radius: 1px; }
:root[data-skin="ios"] .statusbar .bars { display: flex; }
:root[data-skin="ios"] .statusbar .sig { display: none; }
.statusbar .batt { width: 22px; height: 11px; border: 1.5px solid currentColor; border-radius: 3px; position: relative; opacity: .85; }
.statusbar .batt::after { content: ""; position: absolute; inset: 1.5px; right: 5px; background: currentColor; border-radius: 1px; }
:root[data-skin="ios"] .statusbar .batt { width: 25px; height: 12px; border-radius: 4px; opacity: .9; }

.screen { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.view[hidden], .sheet[hidden], .waiting[hidden], .tools[hidden] { display: none !important; }

/* Inbox */
.inbox-head { padding: 10px 16px 6px; background: var(--bar-bg); flex: none; }
.inbox-head .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.inbox-head h1 { margin: 0; font-size: 22px; font-weight: 500; }
:root[data-skin="ios"] .inbox-head h1 { font-size: 34px; font-weight: 700; letter-spacing: -.01em; }
.inbox-head .me { width: 32px; height: 32px; border-radius: 50%; background: #5f6368; color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 500; flex: none; }
.glassbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; display: none; place-items: center; flex: none; color: var(--fg); background: color-mix(in srgb, var(--fg) 6%, var(--bg)); box-shadow: 0 1px 3px rgba(0,0,0,.12), inset 0 0 0 .5px color-mix(in srgb, var(--fg) 10%, transparent); }
.glassbtn svg { width: 20px; height: 20px; fill: currentColor; }
:root[data-skin="ios"] .glassbtn { display: grid; }
:root[data-skin="ios"] .inbox-head .me { display: none; }
.search { margin-top: 10px; background: var(--field-bg); border-radius: 24px; height: 44px; display: flex; align-items: center; padding: 0 16px; color: var(--faint); font-size: 15px; gap: 10px; }
/* iOS 26 moved search and the compose button to the bottom of the list. */
:root[data-skin="ios"] .inbox-head .search { display: none; }
.iosbottom { display: none; position: absolute; left: 14px; right: 14px; bottom: 16px; gap: 10px; align-items: center; }
:root[data-skin="ios"] .iosbottom { display: flex; }
.iosbottom .search { margin: 0; flex: 1; height: 44px; border-radius: 22px; background: color-mix(in srgb, var(--fg) 6%, var(--bg)); box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.iosbottom .glassbtn { width: 44px; height: 44px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.threads { flex: 1; overflow-y: auto; margin: 0; padding: 4px 0 90px; list-style: none; }
.thread { display: flex; gap: 14px; align-items: center; padding: 12px 16px; width: 100%; border: 0; background: transparent; color: var(--fg); text-align: left; }
:root[data-skin="ios"] .thread { padding: 0 16px 0 6px; gap: 10px; }
:root[data-skin="ios"] .thread .body { padding: 10px 0; border-bottom: 1px solid var(--divider); align-self: stretch; }
.thread:hover { background: var(--field-bg); }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--avatar); color: var(--avatar-fg); display: grid; place-items: center; font-size: 18px; font-weight: 500; flex: none; }
.avatar.num { background: var(--in-bg); color: var(--faint); }
:root[data-skin="ios"] .avatar:not(.num) { background: linear-gradient(#a5abb8, #858994); color: #fff; }
:root[data-skin="ios"] .avatar.num { background: linear-gradient(#c9ced8, #aab0bb); color: #fff; }
/* Google Messages gives each contact its own tonal colour. */
:root:not([data-skin="ios"]) .avatar.c1 { background: #c4eed0; color: #072711; }
:root:not([data-skin="ios"]) .avatar.c2 { background: #ffdad6; color: #410002; }
:root:not([data-skin="ios"]) .avatar.c3 { background: #e8def8; color: #1d192b; }
:root:not([data-skin="ios"]) .avatar.c4 { background: #ffdea3; color: #261900; }
:root:not([data-skin="ios"]) .avatar.c5 { background: #c3e8ec; color: #002023; }
:root[data-theme="dark"]:not([data-skin="ios"]) .avatar.c1 { background: #1e4d2b; color: #c4eed0; }
:root[data-theme="dark"]:not([data-skin="ios"]) .avatar.c2 { background: #73332c; color: #ffdad6; }
:root[data-theme="dark"]:not([data-skin="ios"]) .avatar.c3 { background: #4a4458; color: #e8def8; }
:root[data-theme="dark"]:not([data-skin="ios"]) .avatar.c4 { background: #5c4300; color: #ffdea3; }
:root[data-theme="dark"]:not([data-skin="ios"]) .avatar.c5 { background: #1f4d52; color: #c3e8ec; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-skin="ios"]) .avatar.c1 { background: #1e4d2b; color: #c4eed0; }
  :root:not([data-theme="light"]):not([data-skin="ios"]) .avatar.c2 { background: #73332c; color: #ffdad6; }
  :root:not([data-theme="light"]):not([data-skin="ios"]) .avatar.c3 { background: #4a4458; color: #e8def8; }
  :root:not([data-theme="light"]):not([data-skin="ios"]) .avatar.c4 { background: #5c4300; color: #ffdea3; }
  :root:not([data-theme="light"]):not([data-skin="ios"]) .avatar.c5 { background: #1f4d52; color: #c3e8ec; }
}
.avatar svg { width: 24px; height: 24px; fill: currentColor; }
.thread .body { flex: 1; min-width: 0; display: block; }
.thread .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.thread .name { display: block; min-width: 0; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-skin="ios"] .thread .name { font-weight: 600; }
.thread .when { font-size: 12px; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
:root[data-skin="ios"] .thread .when { font-size: 14px; }
:root[data-skin="ios"] .thread .when::after { content: " \203A"; font-size: 17px; color: var(--faint); opacity: .7; }
.thread .preview { display: block; font-size: 14px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
:root[data-skin="ios"] .thread .preview { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; font-size: 15px; }
/* Android marks unread in bold; iPhone with a blue dot left of the avatar. */
.thread.unread .name, .thread.unread .preview, .thread.unread .when { color: var(--fg); font-weight: 700; }
:root[data-skin="ios"] .thread.unread .preview, :root[data-skin="ios"] .thread.unread .when { font-weight: 400; color: var(--faint); }
.thread .dot { display: none; width: 10px; height: 10px; border-radius: 50%; background: var(--unread); flex: none; visibility: hidden; }
:root[data-skin="ios"] .thread .dot { display: block; order: -1; }
.thread.unread .dot { visibility: visible; }
.fab { position: absolute; right: 16px; bottom: 20px; height: 56px; padding: 0 20px; border-radius: 16px; border: 0; background: var(--out-bg); color: var(--out-fg); font-weight: 500; font-size: 15px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
:root[data-skin="ios"] .fab { display: none; }

/* Conversation */
.convo-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--bar-bg); flex: none; min-height: 60px; border-bottom: 1px solid transparent; }
:root[data-skin="ios"] .convo-head { flex-direction: column; justify-content: center; gap: 4px; padding: 4px 8px 8px; min-height: 92px; position: relative; }
.back { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--fg); display: grid; place-items: center; flex: none; }
.back svg { width: 24px; height: 24px; fill: currentColor; }
/* iOS 26: round glass back button, name in a glass pill under the avatar, video button on the right. */
:root[data-skin="ios"] .back { position: absolute; left: 12px; top: 12px; width: 38px; height: 38px; background: color-mix(in srgb, var(--fg) 6%, var(--bg)); box-shadow: 0 1px 3px rgba(0,0,0,.12), inset 0 0 0 .5px color-mix(in srgb, var(--fg) 10%, transparent); }
:root[data-skin="ios"] .back svg { width: 24px; height: 24px; }
.convo-head .avatar { width: 36px; height: 36px; font-size: 15px; }
:root[data-skin="ios"] .convo-head .avatar { width: 50px; height: 50px; font-size: 20px; }
.convo-head .who { min-width: 0; flex: 1; }
:root[data-skin="ios"] .convo-head .who { flex: none; max-width: 70%; }
.convo-head .title { font-size: 17px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
:root[data-skin="ios"] .convo-head .title { font-size: 13px; font-weight: 500; padding: 3px 11px; border-radius: 99px; background: color-mix(in srgb, var(--fg) 6%, var(--bg)); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
:root[data-skin="ios"] .convo-head .title::after { content: " \203A"; color: var(--faint); }
.convo-head .acts { display: flex; gap: 2px; color: var(--muted); }
.convo-head .acts .ic { width: 40px; height: 40px; display: grid; place-items: center; }
.convo-head .acts svg { width: 22px; height: 22px; fill: currentColor; }
:root[data-skin="ios"] .convo-head .acts { display: none; }
.convo-head .glassbtn.video { position: absolute; right: 12px; top: 12px; width: 38px; height: 38px; }

.log { flex: 1; overflow-y: auto; padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 3px; }
:root[data-skin="ios"] .log { padding: 12px 16px 8px; gap: 2px; }
.sep { text-align: center; font-size: 11.5px; color: var(--faint); margin: 14px 0 8px; font-weight: 500; }
:root[data-skin="ios"] .sep { font-weight: 400; font-size: 12px; }
:root[data-skin="ios"] .sep b { font-weight: 600; }
/* Delivered / Read under your last message while it is the last thing in the thread. */
.rcpt { align-self: flex-end; font-size: 11.5px; color: var(--faint); margin: 2px 4px 0 0; display: flex; align-items: center; gap: 4px; animation: pop .18s ease-out; }
.rcpt b { font-weight: 600; }
.rcpt svg { width: 14px; height: 14px; fill: currentColor; }
:root[data-skin="ios"] .rcpt svg { display: none; }
/* Unknown sender notice */
.junk { align-self: center; text-align: center; font-size: 12px; color: var(--faint); margin: 8px 0 4px; line-height: 1.4; }
.junk span { display: block; color: var(--accent); font-size: 14px; }
.spam { align-self: stretch; margin: 4px 0 10px; padding: 12px 14px; border-radius: 16px; background: var(--in-bg); color: var(--fg); font-size: 13.5px; display: flex; flex-direction: column; gap: 10px; }
.spam .btns { display: flex; gap: 8px; }
.spam .btns span { border: 1px solid var(--chip-border); border-radius: 18px; padding: 6px 14px; color: var(--accent); font-weight: 500; font-size: 13.5px; }
:root[data-skin="ios"] .spam, :root:not([data-skin="ios"]) .junk { display: none; }
.msg { max-width: 76%; display: flex; flex-direction: column; animation: pop .18s ease-out; }
.msg.in { align-self: flex-start; align-items: flex-start; }
.msg.out { align-self: flex-end; align-items: flex-end; }
.msg + .msg.in, .msg + .msg.out { margin-top: 0; }
.msg.in + .msg.out, .msg.out + .msg.in { margin-top: 10px; }
.bubble { padding: 9px 13px; border-radius: var(--radius); font-size: 15.5px; line-height: 1.3; word-wrap: break-word; overflow-wrap: anywhere; }
.in .bubble { background: var(--in-bg); color: var(--in-fg); border-bottom-left-radius: var(--tail); }
.out .bubble { background: var(--out-bg); color: var(--out-fg); border-bottom-right-radius: var(--tail); }
.msg.in + .msg.in .bubble { border-top-left-radius: var(--tail); }
.msg.out + .msg.out .bubble { border-top-right-radius: var(--tail); }
/* iMessage: fully round bubbles; only the last bubble of a group gets the curled tail. */
:root[data-skin="ios"] .bubble { font-size: 17px; line-height: 1.29; padding: 7px 13px 8px; position: relative; }
:root[data-skin="ios"] .in .bubble, :root[data-skin="ios"] .out .bubble, :root[data-skin="ios"] .msg.in + .msg.in .bubble, :root[data-skin="ios"] .msg.out + .msg.out .bubble { border-radius: var(--radius); }
:root[data-skin="ios"] .msg.tail .bubble:not(.media)::before { content: ""; position: absolute; bottom: 0; width: 20px; height: 20px; background: inherit; clip-path: path("M0 0 L12 0 Q12 15 20 20 Q9 20 3 15 Z"); }
:root[data-skin="ios"] .msg.out.tail .bubble::before { right: -6px; }
:root[data-skin="ios"] .msg.in.tail .bubble::before { left: -6px; transform: scaleX(-1); }
:root[data-skin="ios"] .msg.tail { margin-bottom: 4px; }
/* Green bubbles for SMS/RCS threads on iPhone */
:root[data-skin="ios"] .sms .out .bubble { background: #34c759; }
:root[data-theme="dark"][data-skin="ios"] .sms .out .bubble { background: #30d158; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"])[data-skin="ios"] .sms .out .bubble { background: #30d158; } }
.msg .stamp { font-size: 11px; color: var(--faint); margin: 3px 6px 0; }
.msg.system { align-self: center; max-width: 86%; text-align: center; font-size: 13px; color: var(--sys-fg); font-style: italic; margin: 10px 0; }
/* Photos stand on their own: rounded image, no bubble fill, no caption. */
.bubble.media { padding: 0; overflow: hidden; background: transparent !important; border-radius: 18px !important; }
.bubble.media img, .bubble.media svg { display: block; width: 240px; max-width: 100%; height: auto; }

<script>
(function () {
  const S = window.NIGHTDESK_STORY;
  const KEY = "frontdesk.v2";
  const $ = id => document.getElementById(id);

  // ---------- helpers ----------
  const UNITS = { s: 1, m: 60, h: 3600, d: 86400 };
  function parseDur(str) { // "1d 2h 30m" -> seconds
    let total = 0; String(str).replace(/(\d+(?:\.\d+)?)\s*([smhd])/g, (_, n, u) => { total += parseFloat(n) * UNITS[u]; });
    return total;
  }
  // "3:12" is Ward 12 time and drifts against ours, so night beats land in the player's evening window instead of at 3 a.m.
  const WINDOW = { start: 20, late: 21.5 }; // local hours: beats open at 20:00; if it's already evening, come in 45 min
  const QUIET = { from: 23, to: 8 }; // nothing lands while the player sleeps; it waits for 08:00
  function nextNight() {
    const now = new Date(), h = now.getHours() + now.getMinutes() / 60;
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), WINDOW.start, 0, 0);
    if (h >= WINDOW.start && h < WINDOW.late) return now.getTime() + 45 * 60000;
    if (h >= WINDOW.late && h < QUIET.from) return now.getTime() + 15 * 60000; // late evening: still tonight
    if (h >= QUIET.from) d.setDate(d.getDate() + 1);
    return d.getTime();
  }
  function nextDay() { // "you sleep": 14:00 local, at least six hours away, never more than a day
    const now = new Date(), d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 14, 0, 0);
